<!DOCTYPE html>
<!--
  CRÉDITOS DO BOLÃO: site de consulta (pesquisa por nome + simulador de abatimento)
  Arquivo único: HTML + CSS + JavaScript, sem servidor e sem bibliotecas externas.
  Funciona no GitHub Pages: basta substituir este index.html e fazer o commit.

  COMO ATUALIZAR OS DADOS (quando chegarem novos meses ou mudar alguém de situação)
  1. Todos os dados estão na constante D, no início do script (procure por "const D=").
  2. Formato de cada pessoa: ["Nome", status, [[mês, cotas, centavos], ...], [["Rótulo", centavos], ...]]
     - status: 0 = ativo em 2026 | 1 = no grupo, sem bolão em 2026 | 2 = fora do grupo
     - mês: posição na lista MS (0 Maio, 1 Junho, 2 Agosto, 3 Setembro). Para um mês novo,
       acrescente o nome em MS e use a nova posição; tudo o mais se ajusta sozinho.
     - créditos anteriores: rótulo livre (ex.: "Dez/25") e valor em centavos.
  3. Valores sempre em CENTAVOS inteiros (R$ 4,73 = 473) para evitar erro de arredondamento.
  4. Não existe campo "total": o script soma créditos de 2026 + anteriores.
  5. A coluna Julho da planilha geral foi ignorada de propósito (não conta no saldo).
  6. Conferência: com os dados atuais são 84 pessoas e o total geral é R$ 706,79.
  7. Manter a lista em ordem alfabética.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Créditos do Bolão</title>
  <style>
    /* CORES (tema claro). Para mudar a identidade visual, altere estas variáveis.
       --pri/--pri2 = cores de destaque; --ok/--wn/--of = status ativo/sem bolão/fora do grupo;
       --bad = valor a pagar. Os padding-top/bottom abaixo respeitam a área segura de celulares com notch. */
    :root {
      --bg: #f3f5fb;
      --card: #fff;
      --tx: #0f172a;
      --mut: #64748b;
      --line: #e2e8f0;
      --pri: #4f46e5;
      --pri2: #9333ea;
      --soft: #eef2ff;
      --ok: #047857;
      --okb: #d1fae5;
      --wn: #b45309;
      --wnb: #fef3c7;
      --of: #475569;
      --ofb: #e2e8f0;
      --bad: #b91c1c;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* TEMA ESCURO automático (segue o aparelho). Mantenha estes valores iguais aos do bloco
       :root[data-theme="dark"] logo abaixo (usado pelo botão de alternar tema). */
    @media(prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1020;
        --card: #151b2e;
        --tx: #e8ecf8;
        --mut: #93a0bd;
        --line: #26304a;
        --pri: #818cf8;
        --pri2: #c084fc;
        --soft: #1e2545;
        --ok: #6ee7b7;
        --okb: #0f3a2e;
        --wn: #fcd34d;
        --wnb: #40300c;
        --of: #cbd5e1;
        --ofb: #2a344d;
        --bad: #fca5a5;
      }
    }

    /* TEMA ESCURO forçado pelo botão 🌓 (mesmos valores do bloco acima) */
    :root[data-theme="dark"] {
      --bg: #0b1020;
      --card: #151b2e;
      --tx: #e8ecf8;
      --mut: #93a0bd;
      --line: #26304a;
      --pri: #818cf8;
      --pri2: #c084fc;
      --soft: #1e2545;
      --ok: #6ee7b7;
      --okb: #0f3a2e;
      --wn: #fcd34d;
      --wnb: #40300c;
      --of: #cbd5e1;
      --ofb: #2a344d;
      --bad: #fca5a5;
    }

    /* BASE: fundo, fonte do sistema (sem download) e espaçamento */
    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg);
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* TOPO com degradê (cabeçalho) */
    .hero {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: #fff;
      padding: 14px 20px 76px;
      text-align: center;
    }
    .hero h1 {
      margin: 4px 0;
      font-size: 1.65rem;
      letter-spacing: -.02em;
    }
    .hero p {
      margin: 0;
      opacity: .88;
      font-size: .93rem;
    }

    /* COLUNA CENTRAL: largura máxima de 640px; sobe sobre o topo para o efeito de sobreposição */
    .wrap {
      max-width: 640px;
      margin: -50px auto 0;
      padding: 0 14px 40px;
    }

    /* CARTÃO branco padrão (busca, resultado e simulador) com animação de entrada */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      margin-bottom: 14px;
      animation: up .35s ease;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(8px); }
    }

    /* CAMPOS DE TEXTO (busca e simulador) */
    input {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--pri);
    }

    /* LISTA DE SUGESTÕES de nomes (aparece quando há mais de um resultado) */
    .sug {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    /* BOTÃO ✕ de limpar (dentro do campo de busca) e LISTA COMPLETA de nomes (com rolagem) */
    .sb {
      position: relative;
    }
    #q {
      padding-right: 56px;
    }
    .x {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--soft);
      color: var(--mut);
      font: inherit;
      cursor: pointer;
    }
    .x:hover {
      color: var(--tx);
    }
    .all {
      max-height: 320px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sug li {
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
    }
    .sug li:first-child {
      border-top: 0;
    }
    .sug li:hover {
      background: var(--soft);
    }

    /* SELOS de status (cores definidas por .ok, .wn e .of) */
    .badge {
      display: inline-block;
      font-size: .76rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .ok {
      color: var(--ok);
      background: var(--okb);
    }
    .wn {
      color: var(--wn);
      background: var(--wnb);
    }
    .of {
      color: var(--of);
      background: var(--ofb);
    }

    /* TOTAL DISPONÍVEL (número grande) e rótulos pequenos de seção */
    .total {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.1;
      margin: 2px 0 12px;
    }
    .lbl {
      font-size: .76rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 600;
      margin: 18px 0 8px;
    }

    /* QUADRINHOS de crédito por mês: grade que se ajusta à largura da tela */
    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }
    .chip {
      background: var(--soft);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .chip b {
      display: block;
    }
    .chip small {
      color: var(--mut);
    }

    /* BARRAS de progresso (2026 x anteriores e crédito usado no simulador) */
    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      display: flex;
    }
    .bar i {
      display: block;
      height: 100%;
      transition: width .4s;
    }

    /* TRÊS CAIXAS do simulador (usado, restante, a pagar); em telas estreitas ficam empilhadas */
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .tile {
      background: var(--soft);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .tile b {
      display: block;
      font-size: 1.05rem;
    }
    .tile small {
      color: var(--mut);
      font-size: .74rem;
    }

    /* BOTÕES: atalhos de valor (R$ 10, 20...), alternar tema e sugestão "Você quis dizer" */
    .q {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .q button, .ic, .lk {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--tx);
      border-radius: 99px;
      padding: 7px 14px;
    }
    .q button:hover, .lk:hover {
      border-color: var(--pri);
    }
    .ic {
      background: rgba(255, 255, 255, .2);
      border-color: transparent;
      color: #fff;
      padding: 6px 11px;
    }
    .msg {
      color: var(--mut);
      text-align: center;
      padding: 22px 12px;
    }
    .note {
      font-size: .85rem;
      color: var(--mut);
    }
    h2, h3 {
      margin: 8px 0 0;
    }

    /* AJUSTES PARA CELULAR PEQUENO e para quem prefere menos animação */
    @media(max-width: 420px) {
      .total { font-size: 2.1rem; }
      .tiles { grid-template-columns: 1fr; }
    }
    @media(prefers-reduced-motion: reduce) {
      .bar i { transition: none; }
      .card { animation: none; }
    }
  </style>
</head>

      ["Thiago Mendes", 2, [], [["Agosto (ant.)",239],["Setembro (ant.)",203]]],
      ["Tiago Augusto da Silva", 1, [], []],
      ["Tiago Silveira D Orta", 0, [[0,1,122],[1,1,88],[2,1,76],[3,1,473]], [["Dez/25",160]]],
      ["Valter Ferreira Fantoni", 1, [], [["Abril/25",75]]],
      ["Victor Aguiar B. Santos", 0, [[0,1,122],[1,1,88],[2,1,76],[3,1,473]], [["Dez/25",160]]],
      ["Vilmar Guimaraes", 0, [[0,2,244],[1,1,88],[2,2,153],[3,1,473]], [["Dez/25",160]]]
    ];
    
    const MS = ["Maio", "Junho", "Agosto", "Setembro"];
    const ST = ["Ativo em 2026", "No grupo · sem bolão em 2026", "Fora do grupo"];
    const SC = ["ok", "wn", "of"];

    /* ====== FUNÇÕES AUXILIARES ======
       $   = atalho para getElementById
       nm  = normaliza texto (sem acento, minúsculo): "João" e "joao" são tratados como iguais
       esc = ESCAPA texto antes de usar em innerHTML. Obrigatório para qualquer texto vindo de
             digitação ou de nomes, para evitar injeção de código. Não remover.
       brl = formata centavos como moeda brasileira (ex.: 919 vira R$ 9,19)
       sum = soma o último item de cada linha (os centavos) */
    const $ = id => document.getElementById(id);
    const nm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
    const brl = c => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const sum = a => a.reduce((t, x) => t + x[x.length - 1], 0);

    /* Pré-processa cada pessoa: cria campos de apoio. t26 = total 2026, t25 = total anteriores,
       t = total disponível (calculado aqui, nunca digitado), k = nome normalizado para a busca. */
    D.forEach((p, i) => {
      p.i = i;
      p.n = p[0];
      p.s = p[1];
      p.a = p[2];
      p.b = p[3];
      p.t26 = sum(p.a);
      p.t25 = sum(p.b);
      p.t = p.t26 + p.t25;
      p.k = nm(p.n);
    });

    /* BUSCA: separa o que foi digitado em palavras; a pessoa aparece se TODAS as palavras
       estiverem no nome (ex.: "vilmar guim" acha "Vilmar Guimaraes"). */
    const toks = q => nm(q).split(/\s+/).filter(Boolean);
    const find = q => {
      const t = toks(q);
      return t.length ? D.filter(p => t.every(x => p.k.includes(x))) : [];
    };

    /* Distância de edição (Levenshtein): conta quantas letras diferem entre duas palavras. */
    function lev(a, b) {
      const d = [...Array(b.length + 1).keys()];
      for (let i = 1; i <= a.length; i++) {
        let p = d[0];
        d[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const t = d[j];
          d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1));
          p = t;
        }
      }
      return d[b.length];
    }

    /* SUGESTÃO "Você quis dizer": quando não há resultado exato, procura nomes parecidos
       (tolera 1 erro em palavras curtas e 2 nas longas) e devolve até 3. */
    function near(q) {
      const t = toks(q);
      return D.map(p => {
        const w = p.k.split(" ");
        let s = 0;
        for (const x of t) {
          const m = Math.min(...w.map(y => lev(x, y.slice(0, x.length))));
          if (m > (x.length > 5 ? 2 : 1)) return null;
          s += m;
        }
        return [s, p];
      }).filter(Boolean).sort((a, b) => a[0] - b[0]).slice(0, 3).map(x => x[1]);
    }

    /* Animação do total (número subindo). Sem animação se o aparelho pedir menos movimento. */
    function count(el, to) {
      if (!to || matchMedia("(prefers-reduced-motion:reduce)").matches) {
        el.textContent = brl(to);
        return;
      }
      let t0;
      const f = t => {
        t0 ??= t;
        const k = Math.min((t - t0) / 600, 1);
        el.textContent = brl(Math.round(to * (1 - Math.pow(1 - k, 3))));
        k < 1 && requestAnimationFrame(f);
      };
      requestAnimationFrame(f);
    }

    /* MOSTRA O PARTICIPANTE: monta o cartão (status, total, barra, créditos 2026 e anteriores)
       e o cartão do simulador. Os textos do resultado são montados aqui; os nomes passam por esc(). */
    function show(p) {
      $("q").value = p.n;
      $("sg").hidden = true;
      $("cl").hidden = false;
      const n26 = p.a.map(([m, c, v]) => `<div class="chip"><b>${brl(v)}</b><small>${MS[m]} · ${c} cota${c > 1 ? "s" : ""}</small></div>`).join("");
      const n25 = p.b.map(([l, v]) => `<div class="chip"><b>${brl(v)}</b><small>${l}</small></div>`).join("");
      const nt = ["", "<p class=\"note\">Está no grupo, mas não participou dos bolões de 2026 listados.</p>", "<p class=\"note\">Consta como fora do grupo. Os créditos seguem registrados para conferência.</p>"][p.s];
      
      $("res").innerHTML = `
        <section class="card">
          <span class="badge ${SC[p.s]}">${ST[p.s]}</span>
          <h2>${esc(p.n)}</h2>
          ${nt}
          <div class="lbl" style="margin-top:14px">Total disponível</div>
          <div class="total" id="tt"></div>
          ${p.t ? `<div class="bar"><i style="width:${p.t26 / p.t * 100}%;background:var(--pri)"></i><i style="width:${p.t25 / p.t * 100}%;background:var(--pri2)"></i></div><div class="note" style="margin-top:6px"><span style="color:var(--pri)">●</span> 2026: ${brl(p.t26)} &nbsp; <span style="color:var(--pri2)">●</span> Anteriores: ${brl(p.t25)}</div>` : `<p class="note">Sem créditos disponíveis no momento.</p>`}
          <div class="lbl">Créditos novos (2026)</div>
          ${n26 ? `<div class="chips">${n26}</div>` : `<p class="note">Nenhum crédito em 2026 nos bolões listados.</p>`}
          <div class="lbl">Créditos anteriores</div>
          ${n25 ? `<div class="chips">${n25}</div>` : `<p class="note">Nenhum crédito anterior.</p>`}
        </section>
        <section class="card">
          <h3>Simulador de abatimento</h3>
          <p class="note" style="margin:4px 0 12px">Informe um valor e veja quanto do seu crédito seria usado.</p>
          <input id="v" inputmode="decimal" autocomplete="off" placeholder="Ex.: 50,00" aria-label="Valor em reais">
          <div class="q">${[10, 20, 50, 100].map(x => `<button data-v="${x}">R$ ${x}</button>`).join("")}</div>
          <div id="sim" style="margin-top:14px"></div>
        </section>`;
      
      count($("tt"), p.t);
      $("v").oninput = () => sim(p);
      sim(p);
    }

    /* SIMULADOR DE ABATIMENTO: lê o valor digitado (aceita vírgula e "R$"), converte para centavos e calcula:
       usado = menor entre valor e crédito | restante = crédito - usado | a pagar = quanto passar do crédito. */
    function sim(p) {
      const el = $("sim"),
            s = $("v").value.trim().replace(/\s/g, "").replace(/^R\$/i, "").replace(",", "."),
            v = Number(s);
      
      if (!s) { el.innerHTML = ""; return; }
      if (!isFinite(v) || v < 0) { el.innerHTML = "<p class=\"note\">Informe um valor positivo, por exemplo 50,00.</p>"; return; }
      
      const c = Math.round(v * 100),
            u = Math.min(c, p.t),
            r = p.t - u,
            pg = Math.max(c - p.t, 0),
            pc = c ? Math.round(u / c * 100) : 0;
            
      el.innerHTML = `
        <div class="bar"><i style="width:${pc}%;background:var(--ok)"></i></div>
        <p class="note" style="margin:6px 0 0">${!c ? "" : pg ? `O crédito cobre ${pc}% do valor. Você paga a diferença.` : "✅ Seu crédito cobre 100% do valor."}</p>
        <div class="tiles">
          <div class="tile"><b>${brl(u)}</b><small>Crédito usado</small></div>
          <div class="tile"><b>${brl(r)}</b><small>Crédito restante</small></div>
          <div class="tile"><b style="color:${pg ? "var(--bad)" : "var(--ok)"}">${brl(pg)}</b><small>A pagar</small></div>
        </div>`;
    }

    /* A CADA LETRA DIGITADA: 1 resultado = abre direto; vários = lista para escolher;
       nenhum = tenta sugerir nomes parecidos; campo vazio = volta à mensagem inicial. */
    function onq() {
      const q = $("q").value,
            m = find(q),
            sg = $("sg"),
            res = $("res");
      
      $("cl").hidden = !q;
      
      if (!q.trim()) {
        sg.hidden = true;
        res.innerHTML = `<div class="card msg">Comece digitando seu nome acima.<br><small>Não precisa de acento nem do nome completo.</small></div>`;
        return;
      }
      if (m.length === 1) { show(m[0]); return; }
      if (m.length) {
        sg.innerHTML = m.slice(0, 6).map(p => `<li data-i="${p.i}"><span>${esc(p.n)}</span><span class="badge ${SC[p.s]}">${ST[p.s]}</span></li>`).join("");
        sg.hidden = false;
        res.innerHTML = `<div class="card msg">${m.length} pessoas encontradas. Escolha seu nome na lista${m.length > 6 ? " ou digite mais letras" : ""}.</div>`;
        return;
      }
      
      sg.hidden = true;
      const n = near(q);
      res.innerHTML = `<div class="card msg">Nenhum nome encontrado para “${esc(q.trim())}”.${n.length ? `<div class="q" style="justify-content:center"><span class="note" style="width:100%">Você quis dizer:</span>${n.map(p => `<button class="lk" data-i="${p.i}">${esc(p.n)}</button>`).join("")}</div>` : "<br><small>Confira a digitação.</small>"}</div>`;
    }

    /* EVENTOS: digitar atualiza a busca; Enter abre o primeiro resultado. */
    $("q").addEventListener("input", onq);
    $("q").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const m = find($("q").value);
        if (m.length) show(m[0]);
      }
    });

    /* CLIQUES (um só ouvinte para a página toda): item da lista ou sugestão (data-i),
       atalho de valor do simulador (data-v) e clique fora da lista para fechá-la. */
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-i],[data-v]");
      if (t && t.dataset.i !== undefined) {
        show(D[+t.dataset.i]);
        if (t.closest("#all")) {
          setAll(false);
          $("res").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
        }
        return;
      }
      if (t && t.dataset.v) {
        $("v").value = t.dataset.v.replace(".", ",");
        $("v").dispatchEvent(new Event("input"));
        return;
      }
      if (!e.target.closest(".sb")) $("sg").hidden = true;
    });

    /* LISTA COMPLETA: setAll(true) monta e abre a lista com todos os nomes (apenas nome e status, sem saldos);
       setAll(false) fecha. Clicar num nome é tratado no ouvinte de cliques acima: preenche a busca e mostra o cartão. */
    function setAll(o) {
      const l = $("all");
      if (o) l.innerHTML = D.map(p => `<li data-i="${p.i}"><span>${esc(p.n)}</span><span class="badge ${SC[p.s]}">${ST[p.s]}</span></li>`).join("");
      l.hidden = !o;
      $("sa").textContent = o ? "🔼 Ocultar lista de nomes" : "📋 Mostrar todos os nomes";
      $("sa").setAttribute("aria-expanded", o);
    }
    $("sa").onclick = () => setAll($("all").hidden);

    /* BOTÃO ✕ LIMPAR: apaga o campo, volta à mensagem inicial e devolve o foco ao campo de busca. */
    $("cl").onclick = () => {
      $("q").value = "";
      onq();
      $("q").focus();
    };

    /* BOTÃO DE TEMA: alterna entre claro e escuro (a escolha vale só enquanto a página está aberta). */
    $("th").onclick = () => {
      const r = document.documentElement,
            d = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
      r.dataset.theme = d ? "light" : "dark";
    };
  </script>
</body>
</html>
