<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Créditos - Bolão</title>
    <!-- Bootstrap 5 CSS para estilização moderna e responsiva -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons para ícones visuais -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .card-main {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .search-box {
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .search-input {
            padding-left: 45px;
            border-radius: 50rem;
            height: 50px;
            font-size: 1.1rem;
        }
        .result-card {
            border-left: 5px solid #0d6efd;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .badge-mes {
            font-size: 0.8rem;
            padding: 5px 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-main p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Consulta de Créditos do Bolão</h2>
                    <p class="text-muted">Pesquise seu nome para verificar o histórico completo e simular abatimentos</p>
                </div>

                <!-- Barra de Pesquisa e Botão para Alternar Tabela Completa -->
                <div class="row g-2 mb-4">
                    <div class="col-md-9 search-box">
                        <i class="bi bi-search fs-5"></i>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Digite seu nome..." onkeyup="filtrarCreditos()" autocomplete="off">
                    </div>
                    <div class="col-md-3 d-grid">
                        <button class="btn btn-outline-primary rounded-pill fw-semibold" onclick="toggleTabelaCompleta()">
                            <span id="btnText"><i class="bi bi-list-ul"></i> Ver Todos</span>
                        </button>
                    </div>
                </div>

                <!-- Área onde os cards de resultados e histórico serão injetados -->
                <div id="resultContainer" class="d-flex flex-column gap-3 mb-3">
                    <p class="text-center text-muted fst-italic">Comece a digitar o seu nome acima para ver o saldo e o histórico.</p>
                </div>

                <!-- Seção da Tabela Completa (Oculta por padrão) -->
                <div id="fullTableContainer" class="d-none mt-4">
                    <hr class="mb-4">
                    <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-people-fill"></i> Lista Completa de Participantes</h5>
                    <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>Nome</th>
                                    <th class="text-end">Total Disponível</th>
                                </tr>
                            </thead>
                            <tbody id="fullTableBody">
                                <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

    /* ==========================================================================
       INICIALIZAÇÃO: Preenche a tabela completa ao carregar a página
       ========================================================================== */
    window.onload = function() {
        const tbody = document.getElementById('fullTableBody');
        baseCreditos.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.nome}</td>
                <td class="text-end fw-bold text-success">R$ ${item.total.toFixed(2).replace('.', ',')}</td>
            `;
            tbody.appendChild(tr);
        });
    };

    /* ==========================================================================
       FUNÇÃO DE FILTRAGEM E BUSCA: Localiza o participante digitado 
       e renderiza o cartão com o histórico de créditos novos e antigos.
       ========================================================================== */
    function filtrarCreditos() {
        const termo = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('resultContainer');
        
        container.innerHTML = '';

        // Se o campo estiver vazio, exibe mensagem inicial
        if (termo === '') {
            container.innerHTML = '<p class="text-center text-muted fst-italic">Comece a digitar o seu nome acima para ver o saldo e o histórico.</p>';
            return;
        }

        // Filtra os participantes que contêm o texto digitado
        const resultados = baseCreditos.filter(item => item.nome.toLowerCase().includes(termo));

        if (resultados.length === 0) {
            container.innerHTML = '<div class="alert alert-warning text-center m-0" role="alert">Nenhum participante encontrado com esse nome.</div>';
            return;
        }

        // Monta os cards para cada participante encontrado
        resultados.forEach((item, index) => {
            // Monta o HTML dos créditos antigos se existirem
            let oldHtml = '';
            const oldKeys = Object.keys(item.old);
            if (oldKeys.length > 0) {
                oldHtml = `<p class="fw-semibold text-secondary small mb-1 mt-2"><i class="bi bi-clock-history"></i> Créditos Anteriores:</p>
                           <div class="d-flex flex-wrap gap-2 mb-2">`;
                oldKeys.forEach(k => {
                    oldHtml += `<span class="badge bg-dark badge-mes">${k}: R$ ${item.old[k].toFixed(2).replace('.', ',')}</span>`;
                });
                oldHtml += `</div>`;
            }

            const card = document.createElement('div');
            card.className = 'card p-4 result-card shadow-sm';
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold text-primary mb-0"><i class="bi bi-person-circle"></i> ${item.nome}</h5>
                    <div class="text-end">
                        <span class="text-muted small d-block">Total Disponível</span>
                        <span class="fs-4 fw-bold text-success">R$ ${item.total.toFixed(2).replace('.', ',')}</span>
                    </div>
                </div>
                
                <hr class="text-muted opacity-25">

                <!-- Histórico de Créditos Novos -->
                <p class="fw-semibold text-secondary small mb-1"><i class="bi bi-calendar-check"></i> Créditos Novos (2026):</p>
                <div class="d-flex flex-wrap gap-2 mb-2">
                    <span class="badge bg-secondary badge-mes">Maio: R$ ${item.maio.toFixed(2).replace('.', ',')}</span>
                    <span class="badge bg-secondary badge-mes">Junho: R$ ${item.junho.toFixed(2).replace('.', ',')}</span>
                    <span class="badge bg-secondary badge-mes">Agosto: R$ ${item.agosto.toFixed(2).replace('.', ',')}</span>
                    <span class="badge bg-secondary badge-mes">Setembro: R$ ${item.setembro.toFixed(2).replace('.', ',')}</span>
                </div>

                <!-- Histórico de Créditos Antigos (se houver) -->
                ${oldHtml}

                <!-- Simulador de Abatimento -->
                <div class="bg-white p-3 rounded-3 border mt-3">
                    <label class="form-label fw-semibold small text-dark"><i class="bi bi-calculator"></i> Simular Abatimento (Valor da Aposta/Jogo em R$):</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" step="0.01" class="form-control" id="inputAposta_${index}" placeholder="Ex: 50.00" oninput="calcularAbatimento(${item.total}, ${index})">
                    </div>
                    <!-- Linha dedicada para exibir o valor abatido e o resultado -->
                    <div id="resultadoAbatimento_${index}" class="mt-2 text-muted small fst-italic">
                        Digite um valor acima para calcular o valor a pagar subtraindo os créditos.
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    /* ==========================================================================
       FUNÇÃO DE ABATIMENTO: Calcula o valor a pagar com base na aposta 
       informada, exibindo explicitamente o valor abatido na linha abaixo.
       ========================================================================== */
    function calcularAbatimento(totalDisponivel, index) {
        const inputVal = document.getElementById(`inputAposta_${index}`).value;
        const divResultado = document.getElementById(`resultadoAbatimento_${index}`);

        if (inputVal === '' || isNaN(inputVal)) {
            divResultado.innerHTML = 'Digite um valor acima para calcular o valor a pagar subtraindo os créditos.';
            return;
        }

        const valorAposta = parseFloat(inputVal);
        // O valor efetivamente abatido é o menor entre a aposta e o total disponível
        const valorAbatido = Math.min(valorAposta, totalDisponivel);
        const aPagar = valorAposta - totalDisponivel;

        if (aPagar <= 0) {
            divResultado.innerHTML = `
                <div class="text-success fw-bold">
                    <i class="bi bi-check-circle-fill"></i> Valor abatido pelos créditos: R$ ${valorAbatido.toFixed(2).replace('.', ',')}
                </div>
                <div class="text-success small mt-1">
                    O seu crédito cobre 100% da aposta! Sobra um saldo de R$ ${Math.abs(aPagar).toFixed(2).replace('.', ',')}. <strong>Valor a pagar: R$ 0,00</strong>
                </div>
            `;
        } else {
            divResultado.innerHTML = `
                <div class="text-danger fw-semibold">
                    <i class="bi bi-dash-circle-fill"></i> Valor abatido por créditos: R$ ${valorDisponivel.toFixed(2).replace('.', ',')}
                </div>
                <div class="text-dark fw-bold mt-1">
                    Valor a pagar (R$ ${valorAposta.toFixed(2).replace('.', ',')} - R$ ${totalDisponivel.toFixed(2).replace('.', ',')}): <span class="text-danger">R$ ${aPagar.toFixed(2).replace('.', ',')}</span>
                </div>
            `;
        }
    }

    /* ==========================================================================
       FUNÇÃO DE EXIBIÇÃO DA TABELA COMPLETA: Alterna a visualização 
       da lista de todos os participantes.
       ========================================================================== */
    function toggleTabelaCompleta() {
        const tabelaDiv = document.getElementById('fullTableContainer');
        const btnText = document.getElementById('btnText');
        
        if (tabelaDiv.classList.contains('d-none')) {
            tabelaDiv.classList.remove('d-none');
            btnText.innerHTML = '<i class="bi bi-eye-slash"></i> Ocultar Todos';
        } else {
            tabelaDiv.classList.add('d-none');
            btnText.innerHTML = '<i class="bi bi-list-ul"></i> Ver Todos';
        }
    }
</script>
