    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Créditos - Bolão</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .card-main {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .search-box {
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .search-input {
            padding-left: 45px;
            border-radius: 50rem;
            height: 50px;
            font-size: 1.1rem;
        }
        .result-card {
            border-left: 5px solid #0d6efd;
            transition: transform 0.2s;
        }
        .result-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-main p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Consulta de Créditos</h2>
                    <p class="text-muted">Digite seu nome para verificar o saldo total disponível no bolão</p>
                </div>

                <!-- Campo de Pesquisa -->
                <div class="search-box mb-4">
                    <i class="bi bi-search fs-5"></i>
                    <input type="text" id="searchInput" class="form-control search-input" placeholder="Digite seu nome..." onkeyup="filtrarCreditos()" autocomplete="off">
                </div>

                <!-- Área de Resultados -->
                <div id="resultContainer" class="d-flex flex-column gap-3">
                    <p class="text-center text-muted fst-italic">Comece a digitar o seu nome acima para ver o resultado.</p>
                </div>
            </div>
        </div>
    </div>
</div>

    function filtrarCreditos() {
        const termo = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('resultContainer');
        
        container.innerHTML = '';

        if (termo === '') {
            container.innerHTML = '<p class="text-center text-muted fst-italic">Comece a digitar o seu nome acima para ver o resultado.</p>';
            return;
        }

        const resultados = baseCreditos.filter(item => item.nome.toLowerCase().includes(termo));

        if (resultados.length === 0) {
            container.innerHTML = '<div class="alert alert-warning text-center m-0" role="alert">Nenhum participante encontrado com esse nome.</div>';
            return;
        }

        resultados.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card p-3 result-card bg-light';
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1 fw-bold text-secondary">Participante</h6>
                        <span class="fs-6 text-dark">${item.nome}</span>
                    </div>
                    <div class="text-end">
                        <span class="d-block text-muted small">Total Disponível</span>
                        <span class="fs-4 fw-bold text-success">R$ ${item.total.toFixed(2).replace('.', ',')}</span>
                    </div>
                </div>
            `;
            container.appendChild(src = card);
        });
    }
